<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>
Raid Simulator - Foxhole Fire Calculator
</title>


<link rel="stylesheet" href="css/style.css">

</head>



<body>


<nav class="navbar">


<div class="logo">
🔥 Foxhole Fire Calculator
</div>


<div class="nav-links">

<a href="index.html">
Fire Calculator
</a>


<a href="raid.html">
Raid Simulator
</a>


<a href="weapons.html">
Weapons
</a>


<a href="buildings.html">
Buildings
</a>


</div>


</nav>



<header>

<h1>
⚔ Tactical Raid Simulator
</h1>

<p>
Simulate an incendiary operation
</p>

</header>



<main>


<section class="card">


<h2>
Attack Force
</h2>


<label>
Weapon
</label>


<select id="raidWeapon">
</select>



<label>
Quantity
</label>


<input
type="number"
id="raidQuantity"
value="5"
min="1"
>



<button id="addWeapon">
Add weapon
</button>


<div id="weaponList">

</div>


</section>




<section class="card">


<h2>
Target
</h2>


<label>
Building
</label>


<select id="raidBuilding">
</select>



<label>
Duration (seconds)
</label>


<input
type="number"
id="raidDuration"
value="120"
>


<button id="simulate">

🔥 Simulate Raid

</button>


</section>




<section class="card">


<h2>
Result
</h2>


<p>
Fire Stack:
<span id="raidFire">
0
</span>
</p>


<p>
Effective Fire:
<span id="raidEffective">
0
</span>
</p>


<p>
Status:
<span id="raidStatus">
-
</span>
</p>


</section>


</main>



<script src="js/simulation.js"></script>

<script src="js/raid.js"></script>


</body>

</html>
